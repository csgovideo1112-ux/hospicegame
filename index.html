<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>H0SP1CE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Главный контейнер для идеального центрирования на любых устройствах -->
    <div id="game-container">

        <div id="lobby">
            <div class="lobby-bg"></div>

            <header class="ui-header">
                <img src="assets/ui/bg-ui.webp" class="ui-bg" alt="">
                <div class="ui-nav">
                    <button class="nav-btn">MAP</button>
                    <button class="nav-btn">STATS</button>
                    <button class="nav-btn">MONEY</button>
                </div>
            </header>

            <div class="character-container">
                <img src="assets/sprites/player/p-default.webp" alt="Player" class="player-char">
            </div>
            <!-- Кнопка одежды -->
                <button class="clothes-btn" id="clothesBtn">
                    <img src="assets/ui/clothes.webp" alt="Clothes" class="clothes-icon">
                </button>
                
                <!-- Панель выбора внешности -->
                <div class="appearance-panel" id="appearancePanel">
                    <h2 class="appearance-title">Choose Appearance</h2>
                    <div class="appearance-options">
                        <div class="appearance-option active" data-sprite="assets/sprites/player/p-default.webp">
                            <div class="head-preview" style="background-image: url('assets/sprites/player/p-default.webp')"></div>
                            <span>Default</span>
                        </div>
                        <div class="appearance-option" data-sprite="assets/sprites/player/p-cut1.webp">
                            <div class="head-preview" style="background-image: url('assets/sprites/player/p-cut1.webp')"></div>
                            <span>Cut</span>
                        </div>
                        <div class="appearance-option" data-sprite="assets/sprites/player/p-short.webp">
                            <div class="head-preview" style="background-image: url('assets/sprites/player/p-short.webp')"></div>
                            <span>Short</span>
                        </div>
                    </div>
                    <button class="appearance-close" id="appearanceClose">Close</button>
                </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
